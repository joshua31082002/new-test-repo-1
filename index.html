<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A simple hello world page."
    />
    <title>Hello World</title>
    <style>
      :root {
        color-scheme: light;
        --color-background: #f6f7fb;
        --color-surface: #ffffff;
        --color-text: #182033;
        --color-muted: #5f6b85;
        --color-accent: #635bff;
        --space-page: clamp(1.5rem, 6vw, 5rem);
        --radius-card: 1.5rem;
        --shadow-card: 0 1.5rem 4rem rgba(24, 32, 51, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: var(--space-page);
        background: var(--color-background);
        color: var(--color-text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      main {
        width: min(100%, 42rem);
        padding: clamp(2rem, 8vw, 5rem);
        border: 1px solid rgba(99, 91, 255, 0.12);
        border-radius: var(--radius-card);
        background: var(--color-surface);
        box-shadow: var(--shadow-card);
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 1rem;
        color: var(--color-accent);
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        line-height: 1.5;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 8vw, 5rem);
        letter-spacing: -0.06em;
        line-height: 1;
        overflow-wrap: break-word;
      }

      p {
        max-width: 32rem;
        margin: 1.5rem auto 0;
        color: var(--color-muted);
        font-size: clamp(1rem, 2vw, 1.125rem);
        line-height: 1.7;
      }

      @media (prefers-reduced-motion: no-preference) {
        main {
          animation: appear 600ms cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes appear {
          from {
            opacity: 0;
            transform: translateY(1rem);
          }
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">A small beginning</p>
      <h1>Hello, world.</h1>
      <p>This page is up and running.</p>
    </main>
  </body>
</html>
