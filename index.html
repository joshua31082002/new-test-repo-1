<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome</title>
    <style>
      :root {
        color-scheme: light;
        --color-background: #f8fafc;
        --color-surface: #ffffff;
        --color-text: #172033;
        --color-muted: #526078;
        --color-accent: #2563eb;
        --space-1: 0.5rem;
        --space-2: 1rem;
        --space-3: 1.5rem;
        --radius: 0.75rem;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: var(--space-3);
        background: var(--color-background);
        color: var(--color-text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.5;
      }

      main {
        width: min(100%, 40rem);
        padding: clamp(2rem, 8vw, 4rem);
        text-align: center;
        background: var(--color-surface);
        border-radius: var(--radius);
        box-shadow: 0 1rem 2.5rem rgb(23 32 51 / 10%);
      }

      h1 {
        margin: 0 0 var(--space-1);
        font-size: clamp(2rem, 6vw, 3rem);
        line-height: 1.1;
      }

      p {
        margin: 0;
        color: var(--color-muted);
      }

      section {
        margin-top: var(--space-3);
        padding-top: var(--space-3);
        border-top: 1px solid #e2e8f0;
        text-align: left;
      }

      h2 {
        margin: 0 0 var(--space-1);
        font-size: 1.25rem;
      }

      a {
        display: inline-block;
        min-height: 44px;
        margin-top: var(--space-3);
        padding: 0.65rem 1rem;
        border-radius: 0.5rem;
        background: var(--color-accent);
        color: #ffffff;
        text-decoration: none;
        transition: transform 180ms ease, background-color 180ms ease;
      }

      a:hover {
        background: #1d4ed8;
        transform: translateY(-2px);
      }

      a:focus-visible {
        outline: 3px solid #93c5fd;
        outline-offset: 3px;
      }

      @media (prefers-reduced-motion: reduce) {
        a {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Welcome</h1>
      <p>Your basic HTML page is ready.</p>

      <section aria-labelledby="about-title">
        <h2 id="about-title">About this page</h2>
        <p>A simple, responsive starting point for your next idea.</p>
      </section>

      <a href="mailto:hello@example.com">Get in touch</a>
    </main>
  </body>
</html>
