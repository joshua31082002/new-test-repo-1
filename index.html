<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A simple hello world page." />
    <title>Hello World</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #101827;
        color: #f4f7fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top, rgba(77, 208, 225, 0.18), transparent 38%),
          #101827;
      }

      main {
        width: min(100%, 680px);
        padding: clamp(40px, 8vw, 88px) clamp(24px, 8vw, 80px);
        text-align: center;
        border: 1px solid rgba(177, 219, 229, 0.2);
        border-radius: 24px;
        background: rgba(20, 35, 55, 0.82);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.3);
      }

      p {
        margin: 0 0 12px;
        color: #8ed9e5;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        color: #ffffff;
        font-size: clamp(2.5rem, 8vw, 5rem);
        line-height: 1;
        letter-spacing: -0.06em;
      }

      @media (prefers-reduced-motion: no-preference) {
        main {
          animation: rise-in 600ms cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes rise-in {
          from {
            opacity: 0;
            transform: translateY(16px);
          }
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p>Welcome</p>
      <h1>Hello, world!</h1>
    </main>
  </body>
</html>
