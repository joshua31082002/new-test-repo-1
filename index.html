<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Simple HTML Page</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f7fb;
        color: #172033;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 640px);
        padding: 48px 32px;
        border: 1px solid #dce2ec;
        border-radius: 16px;
        background: #ffffff;
        box-shadow: 0 16px 40px rgb(23 32 51 / 10%);
        text-align: center;
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(2rem, 6vw, 3.5rem);
        line-height: 1.1;
      }

      p {
        margin: 0;
        color: #536078;
        font-size: 1.125rem;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello, world!</h1>
      <p>This is a simple standalone HTML page.</p>
    </main>
  </body>
</html>
