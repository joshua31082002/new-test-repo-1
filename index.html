<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A simple Hello World sample page."
    />
    <title>Hello World</title>
    <style>
      :root {
        color-scheme: dark;
        --page: #101827;
        --surface: #182338;
        --text: #f5f7fb;
        --muted: #a7b2c8;
        --accent: #63e6be;
        --accent-strong: #2dd4bf;
        --focus: #facc15;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top, #243a5a 0, transparent 48%),
          var(--page);
        color: var(--text);
        font-family: Georgia, 'Times New Roman', serif;
      }

      main {
        width: min(100%, 640px);
        padding: clamp(32px, 8vw, 72px);
        border: 1px solid rgb(255 255 255 / 12%);
        border-radius: 24px;
        background: rgb(24 35 56 / 88%);
        box-shadow: 0 24px 80px rgb(0 0 0 / 32%);
        text-align: center;
        animation: rise 700ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      p {
        margin: 0 0 12px;
        color: var(--accent);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.75rem, 10vw, 5.5rem);
        line-height: 0.95;
        letter-spacing: -0.05em;
      }

      h1 span {
        color: var(--accent);
      }

      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        margin-top: 32px;
        padding: 10px 18px;
        border-radius: 999px;
        background: var(--accent);
        color: #09251f;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.9rem;
        font-weight: 700;
        text-decoration: none;
        transition:
          background-color 180ms ease,
          transform 180ms ease,
          box-shadow 180ms ease;
      }

      a:hover {
        background: var(--accent-strong);
        box-shadow: 0 10px 24px rgb(45 212 191 / 24%);
        transform: translateY(-2px);
      }

      a:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 4px;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 1ms !important;
          scroll-behavior: auto !important;
          transition-duration: 1ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p>A tiny beginning</p>
      <h1>Hello <span>World</span></h1>
      <a href="https://developer.mozilla.org/en-US/docs/Web/HTML" target="_blank" rel="noreferrer">
        Learn HTML
      </a>
    </main>
  </body>
</html>
