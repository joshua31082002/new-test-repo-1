<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A simple, welcoming starting point for your next idea."
    />
    <title>Welcome</title>
    <style>
      :root {
        --color-ink: #17324d;
        --color-muted: #5f7488;
        --color-paper: #f7f4ee;
        --color-surface: #fffdf9;
        --color-accent: #d96c4f;
        --color-accent-dark: #a94732;
        --space-1: 0.5rem;
        --space-2: 1rem;
        --space-3: 1.5rem;
        --space-4: 2rem;
        --space-5: 3rem;
        --radius-lg: 1.25rem;
        --shadow-soft: 0 1.5rem 4rem rgba(23, 50, 77, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        margin: 0;
        color: var(--color-ink);
        background: var(--color-paper);
        font-family: Georgia, "Times New Roman", serif;
        line-height: 1.6;
      }

      .page {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: var(--space-4);
      }

      .card {
        width: min(100%, 48rem);
        padding: clamp(var(--space-4), 7vw, 5rem);
        background: var(--color-surface);
        border: 1px solid rgba(23, 50, 77, 0.1);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-soft);
        animation: rise-in 700ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .eyebrow {
        margin: 0 0 var(--space-2);
        color: var(--color-accent-dark);
        font-family: Arial, sans-serif;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 12ch;
        margin: 0;
        font-size: clamp(2.75rem, 8vw, 5.5rem);
        line-height: 0.98;
        letter-spacing: -0.05em;
      }

      p {
        max-width: 34rem;
        margin: var(--space-3) 0 var(--space-4);
        color: var(--color-muted);
        font-family: Arial, sans-serif;
        font-size: clamp(1rem, 2vw, 1.125rem);
      }

      .button {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        padding: var(--space-1) var(--space-3);
        color: #fff;
        background: var(--color-accent);
        border-radius: 999px;
        font-family: Arial, sans-serif;
        font-weight: 700;
        text-decoration: none;
        transition:
          background-color 180ms ease,
          transform 180ms ease;
      }

      .button:hover {
        background: var(--color-accent-dark);
        transform: translateY(-2px);
      }

      .button:focus-visible {
        outline: 3px solid var(--color-ink);
        outline-offset: 4px;
      }

      @keyframes rise-in {
        from {
          opacity: 0;
          transform: translateY(1rem);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }

      @media (max-width: 480px) {
        .page {
          padding: var(--space-2);
        }

        .card {
          padding: var(--space-4) var(--space-3);
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="card" aria-labelledby="welcome-title">
        <p class="eyebrow">A fresh start</p>
        <h1 id="welcome-title">Make something worth sharing.</h1>
        <p>
          This simple page is ready for your next idea. Replace the message,
          add your content, and make it yours.
        </p>
        <a class="button" href="#welcome-title">Get started</a>
      </section>
    </main>
  </body>
</html>
